server:
  port: 8080

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: main-service
          uri: lb://main-service
          predicates:
            - "Path=/events/**,/admin/**,/users/**,/categories/**,/compilations/**,/locations/**"
