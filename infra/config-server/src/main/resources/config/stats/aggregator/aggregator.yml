server:
  port: ${SERVER_PORT:9094}

spring:
  application:
    name: aggregator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_AGGREGATOR_GROUP_ID:ewm-aggregator}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: ru.practicum.kafka.deserializer.UserActionDeserializer
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.practicum.kafka.serializer.GeneralAvroSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

aggregator:
  consumer:
    group-id: ${KAFKA_AGGREGATOR_GROUP_ID:ewm-aggregator}
  topic:
    user-actions: ${KAFKA_USER_ACTIONS_TOPIC:stats.user-actions.v1}
    event-similarity: ${KAFKA_EVENT_SIMILARITY_TOPIC:stats.events-similarity.v1}
