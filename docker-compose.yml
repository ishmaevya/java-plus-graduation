x-app-env: &app-env
  EUREKA_URL: http://discovery-server:8761/eureka/

x-java-healthcheck: &java-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT}"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 1200s

services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster cluster-id --bootstrap-server kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1
    restart: "no"

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "6541:5432"
    environment:
      POSTGRES_PASSWORD: ewm
      POSTGRES_USER: ewm
      POSTGRES_DB: ewm-stats
    volumes:
      - stats_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    ports:
      - "6543:5432"
    environment:
      POSTGRES_PASSWORD: ewm
      POSTGRES_USER: ewm
      POSTGRES_DB: ewm_user
    volumes:
      - ewm_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      timeout: 5s
      interval: 5s
      retries: 10

  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    image: ewm-discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8761"]

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    image: ewm-config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      <<: *app-env
      SERVER_PORT: "8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck: *java-healthcheck

  stats-server:
    build:
      context: .
      dockerfile: stats/stats-server/Dockerfile
    image: ewm-stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    environment:
      <<: *app-env
      SERVER_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/ewm-stats
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  collector:
    build:
      context: .
      dockerfile: stats/collector/Dockerfile
    image: ewm-collector
    container_name: collector
    environment:
      <<: *app-env
      SERVER_PORT: "9093"
      GRPC_PORT: "9091"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *java-healthcheck

  aggregator:
    build:
      context: .
      dockerfile: stats/aggregator/Dockerfile
    image: ewm-aggregator
    container_name: aggregator
    environment:
      <<: *app-env
      SERVER_PORT: "9094"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *java-healthcheck

  analyzer:
    build:
      context: .
      dockerfile: stats/analyzer/Dockerfile
    image: ewm-analyzer
    container_name: analyzer
    environment:
      <<: *app-env
      SERVER_PORT: "9095"
      GRPC_PORT: "9096"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *java-healthcheck

  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    image: ewm-gateway-server
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      SERVER_PORT: "8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck: *java-healthcheck

  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    image: ewm-user-service
    container_name: user-service
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_user
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  category-service:
    build:
      context: .
      dockerfile: core/category-service/Dockerfile
    image: ewm-category-service
    container_name: category-service
    environment:
      <<: *app-env
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_category
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    image: ewm-request-service
    container_name: request-service
    environment:
      <<: *app-env
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_request
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  event-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    image: ewm-event-service
    container_name: event-service
    environment:
      <<: *app-env
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_event
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    healthcheck: *java-healthcheck

  compilation-service:
    build:
      context: .
      dockerfile: core/compilation-service/Dockerfile
    image: ewm-compilation-service
    container_name: compilation-service
    environment:
      <<: *app-env
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_compilation
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  comment-service:
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    image: ewm-comment-service
    container_name: comment-service
    environment:
      <<: *app-env
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_comment
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  rating-service:
    build:
      context: .
      dockerfile: core/rating-service/Dockerfile
    image: ewm-rating-service
    container_name: rating-service
    environment:
      <<: *app-env
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_rating
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  subscription-service:
    build:
      context: .
      dockerfile: core/subscription-service/Dockerfile
    image: ewm-subscription-service
    container_name: subscription-service
    environment:
      <<: *app-env
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_subscription
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

  location-service:
    build:
      context: .
      dockerfile: core/location-service/Dockerfile
    image: ewm-location-service
    container_name: location-service
    environment:
      <<: *app-env
      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_location
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    healthcheck: *java-healthcheck

volumes:
  stats_db_data:
  ewm_db_data:
